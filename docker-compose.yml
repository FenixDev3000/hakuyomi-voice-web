services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hakuyomi-voice-web:latest
    container_name: hakuyomi_voice_web
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: true
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
      VITE_API_AUTH_TOKEN: ${VITE_API_AUTH_TOKEN}
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          memory: 512M
